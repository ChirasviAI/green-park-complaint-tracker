<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Dashboard - Green Park Care</title>

<style>
body {
    font-family: Arial, sans-serif;
    background: #f1f5f1;
    margin: 0;
    padding: 20px;
}

header {
    background: #176b3a;
    color: white;
    padding: 20px;
    text-align: center;
    border-radius: 10px;
}

.cards {
    display: flex;
    flex-wrap: wrap;
    gap: 15px;
    margin: 25px 0;
}

.card {
    background: white;
    padding: 20px;
    border-radius: 10px;
    flex: 1;
    min-width: 130px;
    text-align: center;
    box-shadow: 0 2px 6px #ccc;
}

.card h2 {
    color: #176b3a;
}

.table-container {
    overflow-x: auto;
    background: white;
    padding: 15px;
    border-radius: 10px;
}

table {
    width: 100%;
    border-collapse: collapse;
    min-width: 1100px;
}

th, td {
    padding: 12px;
    border: 1px solid #ddd;
    text-align: left;
}

th {
    background: #176b3a;
    color: white;
}

select, input, button {
    padding: 8px;
    margin: 4px 0;
}

button {
    background: #176b3a;
    color: white;
    border: none;
    border-radius: 5px;
    cursor: pointer;
}

button:disabled {
    background: gray;
    cursor: not-allowed;
}

.proof-image {
    width: 120px;
    border-radius: 6px;
    display: block;
    margin-bottom: 6px;
}

.proof-link {
    color: #176b3a;
    font-weight: bold;
}

#emptyMessage {
    color: #b33;
    text-align: center;
}
</style>
</head>

<body>

<header>
    <h1>Green Park & Garden Care</h1>
    <h2>Admin Dashboard</h2>
    <p>Manage Public Park Complaints</p>
</header>

<div class="cards">
    <div class="card">
        <h3>Total Complaints</h3>
        <h2 id="total">0</h2>
    </div>

    <div class="card">
        <h3>Pending</h3>
        <h2 id="pending">0</h2>
    </div>

    <div class="card">
        <h3>In Progress</h3>
        <h2 id="progress">0</h2>
    </div>

    <div class="card">
        <h3>Resolved</h3>
        <h2 id="resolved">0</h2>
    </div>
</div>

<h2>Complaint Details</h2>

<div class="table-container">
<table>
<thead>
<tr>
    <th>Complaint ID</th>
    <th>Name</th>
    <th>Location</th>
    <th>Category</th>
    <th>Description</th>
    <th>Date</th>
    <th>Resolution Proof</th>
    <th>Status</th>
</tr>
</thead>

<tbody id="complaintTable"></tbody>
</table>
</div>

<p id="emptyMessage">Loading complaints...</p>

<script type="module">

import {
    initializeApp
} from "https://www.gstatic.com/firebasejs/13.4.0/firebase-app.js";

import {
    getFirestore,
    collection,
    onSnapshot,
    doc,
    updateDoc,
    serverTimestamp
} from "https://www.gstatic.com/firebasejs/13.4.0/firebase-firestore.js";

import {
    getStorage,
    ref,
    uploadBytes,
    getDownloadURL
} from "https://www.gstatic.com/firebasejs/13.4.0/firebase-storage.js";

const firebaseConfig = {
    apiKey: "AIzaSyAK8b_tmr3VhuFjZSgT4IwVecbpqi-M_Uk",
    authDomain: "green-park-complaint-tracker.firebaseapp.com",
    projectId: "green-park-complaint-tracker",
    storageBucket: "green-park-complaint-tracker.firebasestorage.app",
    messagingSenderId: "521073074369",
    appId: "1:521073074369:web:ae1a490a5cd7e2c780b440",
    measurementId: "G-52ZQKDQHYW"
};

const app = initializeApp(firebaseConfig);

const db = getFirestore(app);
const storage = getStorage(app);


// LOAD COMPLAINTS

function loadComplaints() {

    onSnapshot(collection(db, "complaints"), (snapshot) => {

        const complaints = snapshot.docs.map(document => ({
            ...document.data(),
            documentId: document.id
        }));

        const table = document.getElementById("complaintTable");

        table.innerHTML = "";

        let pending = 0;
        let progress = 0;
        let resolved = 0;

        complaints.forEach(complaint => {

            if (complaint.status === "Pending") pending++;
            if (complaint.status === "In Progress") progress++;
            if (complaint.status === "Resolved") resolved++;

            const row = document.createElement("tr");

            // COMPLAINT DETAILS

            const values = [
                complaint.id,
                complaint.name,
                complaint.location,
                complaint.category,
                complaint.description,
                complaint.date
            ];

            values.forEach(value => {

                const cell = document.createElement("td");

                cell.textContent = value || "-";

                row.appendChild(cell);

            });


            // RESOLUTION PROOF SECTION

            const proofCell = document.createElement("td");

            const fileInput = document.createElement("input");

            fileInput.type = "file";
            fileInput.accept = "image/*";

            const uploadButton = document.createElement("button");

            uploadButton.textContent = "Upload Proof";

            const proofMessage = document.createElement("p");

            proofMessage.style.fontSize = "12px";

            if (complaint.resolutionPhotoUrl) {

                const image = document.createElement("img");

                image.src = complaint.resolutionPhotoUrl;
                image.className = "proof-image";
                image.alt = "Resolution proof";

                proofCell.appendChild(image);

                const link = document.createElement("a");

                link.href = complaint.resolutionPhotoUrl;
                link.target = "_blank";
                link.textContent = "View Uploaded Proof";
                link.className = "proof-link";

                proofCell.appendChild(link);

                proofMessage.textContent = "Proof uploaded successfully";

            } else {

                proofMessage.textContent = "No resolution proof uploaded";

            }

            proofCell.appendChild(fileInput);
            proofCell.appendChild(uploadButton);
            proofCell.appendChild(proofMessage);


            // UPLOAD PHOTO TO FIREBASE STORAGE

            uploadButton.addEventListener("click", async function() {

                const file = fileInput.files[0];

                if (!file) {
                    alert("Please select a cleaning photograph first.");
                    return;
                }

                if (!file.type.startsWith("image/")) {
                    alert("Please select a valid image.");
                    return;
                }

                if (file.size > 5 * 1024 * 1024) {
                    alert("Image size must be less than 5 MB.");
                    return;
                }

                uploadButton.disabled = true;
                uploadButton.textContent = "Uploading...";

                try {

                    const imagePath =
                        "resolutionProof/" +
                        complaint.documentId + "/" +
                        Date.now() + "_" + file.name;

                    const imageRef = ref(storage, imagePath);

                    await uploadBytes(imageRef, file);

                    const downloadURL =
                        await getDownloadURL(imageRef);

                    // SAVE PHOTO URL IN FIRESTORE

                    await updateDoc(
                        doc(db, "complaints", complaint.documentId),
                        {
                            resolutionPhotoUrl: downloadURL,
                            resolutionPhotoPath: imagePath,
                            resolutionUploadedAt: serverTimestamp()
                        }
                    );

                    alert("Cleaning proof uploaded successfully!");

                } catch (error) {

                    console.error(error);

                    alert("Photo upload failed. Check Firebase Storage settings and permissions.");

                } finally {

                    uploadButton.disabled = false;
                    uploadButton.textContent = "Upload Proof";

                }

            });

            row.appendChild(proofCell);


            // STATUS SECTION

            const statusCell = document.createElement("td");

            const select = document.createElement("select");

            ["Pending", "In Progress", "Resolved"].forEach(status => {

                const option = document.createElement("option");

                option.value = status;
                option.textContent = status;

                if (complaint.status === status) {
                    option.selected = true;
                }

                select.appendChild(option);

            });


            select.addEventListener("change", async function() {

                const newStatus = this.value;

                // RESOLVED REQUIRES PHOTO PROOF

                if (
                    newStatus === "Resolved" &&
                    !complaint.resolutionPhotoUrl
                ) {

                    alert(
                        "Please upload the after-cleaning photograph before marking this complaint as Resolved."
                    );

                    this.value = complaint.status || "Pending";

                    return;
                }

                this.disabled = true;

                try {

                    await updateDoc(
                        doc(db, "complaints", complaint.documentId),
                        {
                            status: newStatus,
                            ...(newStatus === "Resolved"
                                ? { resolvedAt: serverTimestamp() }
                                : { resolvedAt: null })
                        }
                    );

                } catch (error) {

                    console.error(error);

                    alert("Unable to update complaint status.");

                    this.value = complaint.status || "Pending";

                } finally {

                    this.disabled = false;

                }

            });

            statusCell.appendChild(select);

            row.appendChild(statusCell);

            table.appendChild(row);

        });


        // UPDATE DASHBOARD COUNTS

        document.getElementById("total").textContent =
            complaints.length;

        document.getElementById("pending").textContent =
            pending;

        document.getElementById("progress").textContent =
            progress;

        document.getElementById("resolved").textContent =
            resolved;


        document.getElementById("emptyMessage").textContent =
            complaints.length === 0
            ? "No complaints available yet."
            : "";

    }, error => {

        console.error(error);

        document.getElementById("emptyMessage").textContent =
            "Unable to load complaints. Check Firebase permissions.";

    });

}

loadComplaints();

</script>

</body>
</html>
